name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Syntax, structure, imports, security, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs

  unit:
    name: Unit, property & differential tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run-node.mjs

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    needs: [checks, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Development-only tooling; the released app has no runtime dependencies.
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: node scripts/serve.mjs 8080 &
      - name: Wait for server
        run: for i in $(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
      - run: node tests/e2e/e2e.mjs
